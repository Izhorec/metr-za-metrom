  <div class="controls">
    <div class="row">
      <div class="seg" id="citySeg">
        <button data-city="spb" class="active">СПб</button>
        <button data-city="msk">Москва</button>
      </div>
      <div class="seg" id="viewSeg">
        <button data-view="map" class="active">Карта</button>
        <button data-view="list">Список</button>
      </div>
    </div>
    <input id="search" type="search" placeholder="Поиск: название, застройщик, район" autocomplete="off" />
    <div class="chips" id="statusChips">
      <button data-status="all" class="chip active">Все</button>
      <button data-status="announce" class="chip"><i class="dot dot--announce"></i>Анонс</button>
      <button data-status="soon" class="chip"><i class="dot dot--soon"></i>Скоро старт</button>
      <button data-status="sale" class="chip"><i class="dot dot--sale"></i>Старт продаж</button>
      <span class="sep"></span>
      <button data-class="all" class="chip cls active">Любой класс</button>
      <button data-class="комфорт" class="chip cls">Комфорт</button>
      <button data-class="бизнес" class="chip cls">Бизнес</button>
      <button data-class="премиум" class="chip cls">Премиум</button>
    </div>
    <div id="saleHint" class="hint hidden"><i class="dot dot--sale"></i>Объекты в статусе «Старт продаж» держатся на карте месяц, дальше — только в личных сообщениях</div>
  </div>

  <main>
    <div id="map"></div>
    <div id="list" class="list hidden"></div>
    <div id="counter" class="counter"></div>
  </main>

  <div id="sheetBackdrop" class="backdrop hidden"></div>
  <section id="sheet" class="sheet" aria-hidden="true">
    <div class="grab"></div>
    <div id="sheetContent"></div>
  </section>
